<div
  class="h-screen w-screen flex flex-col bg-[#121214] text-zinc-100 overflow-hidden select-none"
  [class.cursor-col-resize]="isResizing() !== null"
>
  <!-- Top Global Header -->
  <app-header></app-header>

  <!-- Main Multi-Pane / Mobile Adaptive Workspace -->
  <main class="flex-1 min-h-0 relative flex overflow-hidden">
    <!-- DESKTOP / TABLET WORKSPACE (md:flex) -->
    <div class="hidden md:flex w-full h-full overflow-hidden relative">
      <!-- Left: Widget Palette (Resizable & Scrollable) -->
      <aside
        class="h-full shrink-0 overflow-hidden flex flex-col bg-[#18181c]"
        [style.width.px]="store.leftPanelWidth()"
      >
        <app-palette class="h-full w-full block overflow-hidden"></app-palette>
      </aside>

      <!-- Left Resizer Splitter -->
      <div
        class="w-1.5 h-full cursor-col-resize bg-[#202026] hover:bg-emerald-500/80 active:bg-emerald-500 transition-colors shrink-0 flex items-center justify-center group relative z-20 select-none"
        (mousedown)="startLeftResize($event)"
        (dblclick)="resetLeftWidth()"
        title="Drag to resize Palette (double-click to reset)"
      >
        <div
          class="w-0.5 h-8 bg-zinc-600 group-hover:bg-white rounded-full transition-colors pointer-events-none"
        ></div>
      </div>

      <!-- Center: Formspec Canvas or Code View -->
      <section class="flex-1 h-full min-w-0 relative overflow-hidden">
        @if (store.activeTab() === 'code') {
          <app-code-view></app-code-view>
        } @else {
          <app-canvas></app-canvas>
        }
      </section>

      <!-- Right Resizer Splitter -->
      <div
        class="w-1.5 h-full cursor-col-resize bg-[#202026] hover:bg-emerald-500/80 active:bg-emerald-500 transition-colors shrink-0 flex items-center justify-center group relative z-20 select-none"
        (mousedown)="startRightResize($event)"
        (dblclick)="resetRightWidth()"
        title="Drag to resize Inspector (double-click to reset)"
      >
        <div
          class="w-0.5 h-8 bg-zinc-600 group-hover:bg-white rounded-full transition-colors pointer-events-none"
        ></div>
      </div>

      <!-- Right: Property Inspector (Resizable & Scrollable) -->
      <aside
        class="h-full shrink-0 overflow-hidden flex flex-col bg-[#18181c]"
        [style.width.px]="store.rightPanelWidth()"
      >
        <app-inspector class="h-full w-full block overflow-hidden"></app-inspector>
      </aside>
    </div>

    <!-- MOBILE WORKSPACE (< md) -->
    <div class="flex md:hidden w-full h-full overflow-hidden flex-col">
      <div class="flex-1 w-full h-full min-h-0 relative">
        @if (store.activeTab() === 'canvas') {
          <app-canvas></app-canvas>
        } @else if (store.activeTab() === 'palette') {
          <app-palette></app-palette>
        } @else if (store.activeTab() === 'inspector') {
          <app-inspector></app-inspector>
        } @else if (store.activeTab() === 'code') {
          <app-code-view></app-code-view>
        }
      </div>

      <!-- Mobile Bottom Navigation Bar -->
      <nav
        class="h-14 bg-[#18181c] border-t border-[#282830] flex items-center justify-around px-2 shrink-0 select-none text-[10px]"
        aria-label="Mobile Navigation"
      >
        <button
          (click)="store.setActiveTab('canvas')"
          [class.text-emerald-400]="store.activeTab() === 'canvas'"
          [class.text-zinc-400]="store.activeTab() !== 'canvas'"
          [attr.aria-current]="store.activeTab() === 'canvas' ? 'page' : null"
          aria-label="Canvas View"
          class="flex flex-col items-center justify-center min-w-[48px] min-h-[44px] gap-1 font-medium transition active:scale-95"
        >
          <svg lucideLayout class="w-4 h-4"></svg>
          <span>Canvas</span>
        </button>

        <button
          (click)="store.setActiveTab('palette')"
          [class.text-emerald-400]="store.activeTab() === 'palette'"
          [class.text-zinc-400]="store.activeTab() !== 'palette'"
          [attr.aria-current]="store.activeTab() === 'palette' ? 'page' : null"
          aria-label="Widget Palette"
          class="flex flex-col items-center justify-center min-w-[48px] min-h-[44px] gap-1 font-medium transition active:scale-95"
        >
          <svg lucidePlus class="w-4 h-4"></svg>
          <span>Widgets</span>
        </button>

        <button
          (click)="store.setActiveTab('inspector')"
          [class.text-emerald-400]="store.activeTab() === 'inspector'"
          [class.text-zinc-400]="store.activeTab() !== 'inspector'"
          [attr.aria-current]="store.activeTab() === 'inspector' ? 'page' : null"
          aria-label="Properties Inspector"
          class="flex flex-col items-center justify-center min-w-[48px] min-h-[44px] gap-1 font-medium transition active:scale-95"
        >
          <svg lucideSliders class="w-4 h-4"></svg>
          <span>Properties</span>
        </button>

        <button
          (click)="store.setActiveTab('code')"
          [class.text-emerald-400]="store.activeTab() === 'code'"
          [class.text-zinc-400]="store.activeTab() !== 'code'"
          [attr.aria-current]="store.activeTab() === 'code' ? 'page' : null"
          aria-label="Lua Code View"
          class="flex flex-col items-center justify-center min-w-[48px] min-h-[44px] gap-1 font-medium transition active:scale-95"
        >
          <svg lucideCode class="w-4 h-4"></svg>
          <span>Lua Code</span>
        </button>
      </nav>
    </div>
  </main>

  <!-- Modal Dialogs -->
  <app-template-modal></app-template-modal>
  <app-settings-modal></app-settings-modal>
  <app-shortcuts-dialog></app-shortcuts-dialog>
  <app-help-dialog></app-help-dialog>
  <app-share-dialog></app-share-dialog>
</div>
