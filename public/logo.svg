<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="fsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="#18181c" />
  <rect x="8" y="8" width="112" height="112" rx="20" fill="none" stroke="#2c2c34" stroke-width="2" />
  
  <!-- Formspec Slot Grid Mockup -->
  <g filter="url(#shadow)">
    <rect x="24" y="24" width="80" height="80" rx="12" fill="#24242a" stroke="#3e3e48" stroke-width="2"/>
    <!-- Slot 1 -->
    <rect x="34" y="34" width="26" height="26" rx="4" fill="#1a1a20" stroke="#059669" stroke-width="2"/>
    <!-- Slot 2 -->
    <rect x="68" y="34" width="26" height="26" rx="4" fill="#1a1a20" stroke="#2e2e38" stroke-width="1.5"/>
    <!-- Button bottom -->
    <rect x="34" y="70" width="60" height="22" rx="6" fill="url(#fsGrad)"/>
    <text x="64" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">FORM</text>
  </g>
</svg>
