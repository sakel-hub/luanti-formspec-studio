<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Steel Sword Icon -->
  <g transform="rotate(45 24 24)">
    <!-- Blade -->
    <rect x="22" y="4" width="4" height="26" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <path d="M22,4 L24,1 L26,4 Z" fill="#f8fafc"/>
    <line x1="24" y1="4" x2="24" y2="30" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Guard -->
    <rect x="16" y="30" width="16" height="4" rx="1" fill="#475569" stroke="#334155" stroke-width="1"/>
    <!-- Hilt Handle -->
    <rect x="22" y="34" width="4" height="8" fill="#78350f" stroke="#451a03" stroke-width="1"/>
    <!-- Pommel -->
    <circle cx="24" cy="44" r="3" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
  </g>
</svg>
